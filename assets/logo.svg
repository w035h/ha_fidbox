<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
  <!-- Bluetooth arc -->
  <path d="M 40 20 A 60 60 0 0 1 40 140" fill="none" stroke="#41BDF5" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Bluetooth symbol -->
  <g transform="translate(52,60)">
    <path d="M 8 0 L 24 16 L 8 32 M 8 32 L 24 48 M 8 0 L 8 32 L 24 16"
          fill="none" stroke="#41BDF5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- Fidbox device -->
  <g transform="translate(110,40)">
    <rect x="0" y="0" width="90" height="80" rx="10" fill="#263238"/>
    <rect x="8" y="8" width="74" height="30" rx="6" fill="#8D6E63"/>
    <rect x="8" y="44" width="74" height="28" rx="6" fill="#546E7A"/>
    <!-- humidity drops -->
    <path d="M 20 20 C 20 20 14 28 14 32 A 6 6 0 0 0 26 32 C 26 28 20 20 20 20 Z" fill="#41BDF5"/>
    <path d="M 60 56 C 60 56 54 64 54 68 A 6 6 0 0 0 66 68 C 66 64 60 56 60 56 Z" fill="#41BDF5"/>
    <!-- temperature -->
    <g transform="translate(52,14)">
      <circle cx="6" cy="18" r="5" fill="#FF7043"/>
      <path d="M 6 0 L 6 13" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(20,52)">
      <circle cx="6" cy="14" r="4" fill="#4FC3F7"/>
      <path d="M 6 2 L 6 10" stroke="#4FC3F7" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Text -->
  <text x="230" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#41BDF5">Fidbox</text>
  <text x="230" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#78909C">for Home Assistant</text>
</svg>
