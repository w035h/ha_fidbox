<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Thermometer (left, centered on y=256) -->
  <g transform="translate(120 256)">
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-9" y="-64" width="18" height="84" rx="9"/>
      <circle cx="0" cy="42" r="22"/>
      <line x1="-16" y1="-40" x2="-12" y2="-40"/>
      <line x1="12" y1="-40" x2="16" y2="-40"/>
      <line x1="-16" y1="-20" x2="-12" y2="-20"/>
      <line x1="12" y1="-20" x2="16" y2="-20"/>
      <line x1="-16" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="16" y2="0"/>
      <line x1="-16" y1="20" x2="-12" y2="20"/>
      <line x1="12" y1="20" x2="16" y2="20"/>
    </g>
    <path d="M 0 -56 L 0 40" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="42" r="13" fill="#bae6fd"/>
  </g>

  <!-- Droplet (right, mirrored position, same vertical center) -->
  <g transform="translate(392 256)">
    <path d="M 0 -64 C 20 -36 38 -10 38 26 A 38 38 0 1 1 -38 26 C -38 -10 -20 -36 0 -64 Z"
          fill="#bae6fd" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- Bluetooth bind-rune (center) -->
  <g transform="translate(256 256) scale(6)"
     fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0 -10 L 0 10"/>
    <path d="M 0 -10 L 5.7 -4.3 L 0 0"/>
    <path d="M 0 10 L 5.7 4.3 L 0 0"/>
    <path d="M 0 0 L -5.7 -5.7"/>
    <path d="M 0 0 L -5.7 5.7"/>
  </g>
</svg>
