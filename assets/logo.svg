<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
  <!-- Signal arcs, radiating from behind the rune -->
  <path d="M 31 44 A 42 42 0 0 0 31 116" fill="none" stroke="#41BDF5" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 37 54 A 30 30 0 0 0 37 106" fill="none" stroke="#41BDF5" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Bluetooth bind-rune (Hagall + Bjarkan), correct geometry:
       - vertical stem
       - two wedges on the right meeting at the stem centre point
       - two wings crossing the stem and protruding to the left -->
  <g transform="translate(52,80) scale(2.6)" fill="none" stroke="#41BDF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 -10 L 0 10"/>
    <path d="M 0 -10 L 5.7 -4.3 L 0 0"/>
    <path d="M 0 10 L 5.7 4.3 L 0 0"/>
    <path d="M 0 0 L -5.7 -5.7"/>
    <path d="M 0 0 L -5.7 5.7"/>
  </g>

  <!-- Fidbox device -->
  <g transform="translate(120,44)">
    <rect x="0" y="0" width="86" height="72" rx="10" fill="#263238"/>
    <rect x="8" y="8" width="70" height="27" rx="6" fill="#8D6E63"/>
    <rect x="8" y="41" width="70" height="23" rx="6" fill="#546E7A"/>
    <path d="M 22 18 C 22 18 17 25 17 29 A 5 5 0 0 0 27 29 C 27 25 22 18 22 18 Z" fill="#41BDF5"/>
    <path d="M 62 48 C 62 48 57 55 57 59 A 5 5 0 0 0 67 59 C 67 55 62 48 62 48 Z" fill="#41BDF5"/>
    <g transform="translate(56,12)">
      <circle cx="5" cy="15" r="4" fill="#FF7043"/>
      <path d="M 5 0 L 5 11" stroke="#FF7043" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(20,44)">
      <circle cx="5" cy="11" r="3.5" fill="#4FC3F7"/>
      <path d="M 5 0 L 5 7" stroke="#4FC3F7" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Text -->
  <text x="232" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#41BDF5">Fidbox</text>
  <text x="232" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#78909C">for Home Assistant</text>
</svg>
